name: Maintain merge changelog

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

# Only merged main code is checked out, never a pull request head or test ref.
# titles and other PR data are JSON inputs to Python, never shell expressions.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pse-changelog-main
  cancel-in-progress: false

jobs:
  changelog:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Record merges, synchronize bundled notes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Refresh and regenerate if another merge beats this bot's push.
            # This reset affects only the disposable Actions checkout.
            git fetch origin main
            git reset --hard origin/main
            python3 tests/changelog-generator.py
            python3 scripts/update-changelog.py
            php -l index.php
            git add -- CHANGELOG.md index.php .github/changelog-state.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'docs: record merged changes'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Changelog could not be published. Check branch protection and rerun this workflow.' >&2
          exit 1
